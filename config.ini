# AI Headline Impact Processor - Configuration File
# Environment-specific parameters for the analysis system

[DEFAULT]
# Default values that apply to all environments
google_cloud_region = us-central1
model_name = gemini-2.5-flash-lite
max_tokens = 2048
temperature = 0.3
timeout_seconds = 30
rate_limit_rpm = 60
batch_size = 10
max_concurrent_llm_calls = 5
max_entities_per_analysis = 20
processing_timeout_seconds = 120
retry_attempts = 3
feature_cache_enabled = true
log_level = INFO
prometheus_enabled = false
rate_limiting_enabled = false
request_validation_enabled = false
audit_logging_enabled = false

[test]
# Test environment - Mock LLM for fast testing
provider = mock_llm
use_mock_llm = true
timeout_seconds = 10
max_concurrent_llm_calls = 1
processing_timeout_seconds = 30
retry_attempts = 1
log_level = WARNING

[dev]
# Development environment - Mock LLM for development
provider = mock_llm
use_mock_llm = true
max_concurrent_llm_calls = 2
feature_cache_enabled = false
log_level = DEBUG

[uat]
# UAT environment - Real Gemini Flash
provider = gemini_flash
use_mock_llm = false
rate_limit_rpm = 100
max_concurrent_llm_calls = 3
processing_timeout_seconds = 90
log_level = INFO
prometheus_enabled = true
audit_logging_enabled = true

[prod]
# Production environment - Real Gemini Flash with full features
provider = gemini_flash
use_mock_llm = false
rate_limit_rpm = 300
timeout_seconds = 60
max_concurrent_llm_calls = 10
max_entities_per_analysis = 50
processing_timeout_seconds = 180
log_level = WARNING
prometheus_enabled = true
rate_limiting_enabled = true
request_validation_enabled = true
audit_logging_enabled = true

# Business Logic Configuration
[business]
supported_currencies = EURUSD,GBPUSD,USDJPY,AUDUSD,USDCAD,USDCHF,NZDUSD,EURGBP,EURJPY,GBPJPY
supported_commodities = XAUUSD,XAGUSD,WTI,BRENT,NATGAS
impact_threshold_minor = 0.02
impact_threshold_moderate = 0.05
impact_threshold_major = 0.10
confidence_threshold = 0.7
analysis_window_hours = 24

# Feed / Kafka Configuration
[feeds]
kafka_bootstrap_servers = localhost:9092
kafka_input_topic = raw-headlines
kafka_output_topic = headline-impacts
kafka_consumer_group = hl-analyzer
kafka_sse_consumer_group = sse-server

# File source settings
file_source_rate_per_second = 1.0

[feeds:prod]
kafka_bootstrap_servers = prod-kafka.example.com:9092
kafka_input_topic = raw-headlines
kafka_output_topic = headline-impacts

# KDB+ Source Configuration
[kdb]
host = localhost
port = 5000
# q query — must return columns: text, source, time
query = select text, source, time from headlines where date=.z.d
poll_interval_seconds = 60
# username and password are optional; leave blank if KDB+ has no auth
username =
password =

[kdb:prod]
host = kdb-prod.internal
port = 5000

# Redis Cache + Impact Graph Configuration
[cache]
redis_host = localhost
redis_port = 6379
redis_db = 0
cache_ttl_seconds = 86400
active_impact_window_minutes = 60
# Enterprise settings — leave blank for local dev, set via env vars for prod
# Env var overrides: REDIS_PASSWORD, REDIS_SSL, REDIS_SSL_CERT_REQS,
#                    REDIS_SOCKET_TIMEOUT, REDIS_MAX_CONNECTIONS
redis_password =
redis_ssl = false
redis_ssl_cert_reqs = required
redis_socket_timeout = 5
redis_socket_connect_timeout = 5
redis_max_connections = 10

[cache:prod]
redis_host = redis-prod.internal
redis_port = 6380
redis_ssl = true
redis_max_connections = 50