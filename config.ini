# Financial News Impact Analysis - Configuration File
# Environment-specific parameters for the news analysis system

[DEFAULT]
# Default values that apply to all environments
google_cloud_region = us-central1
max_tokens = 2048
temperature = 0.3
timeout_seconds = 30
rate_limit_rpm = 60
batch_size = 10
max_concurrent_llm_calls = 5
max_entities_per_analysis = 20
processing_timeout_seconds = 120
retry_attempts = 3

[test]
# Test environment configuration
model_name = gemini-flash-lite-latest
provider = gemini_flash
use_mock_llm = false
rate_limit_rpm = 100
max_concurrent_llm_calls = 3
processing_timeout_seconds = 90
log_level = DEBUG
prometheus_enabled = true
audit_logging_enabled = true

[dev]
# Development environment configuration
model_name = gemini-flash-lite-latest
provider = mock_llm
use_mock_llm = true
rate_limit_rpm = 120
max_concurrent_llm_calls = 2
feature_cache_enabled = false
log_level = DEBUG
prometheus_enabled = false
rate_limiting_enabled = false
request_validation_enabled = false

[uat]
# UAT environment configuration
model_name = gemini-flash-lite-latest
provider = gemini_flash
use_mock_llm = false
rate_limit_rpm = 100
max_concurrent_llm_calls = 3
processing_timeout_seconds = 90
log_level = INFO
prometheus_enabled = true
audit_logging_enabled = true

[prod]
# Production environment configuration
model_name = gemini-flash-lite-latest
provider = gemini_flash
use_mock_llm = false
rate_limit_rpm = 300
timeout_seconds = 60
max_concurrent_llm_calls = 10
max_entities_per_analysis = 50
processing_timeout_seconds = 180
log_level = WARNING
prometheus_enabled = true
api_key_encryption_enabled = true
rate_limiting_enabled = true
request_validation_enabled = true
audit_logging_enabled = true

# Database Configuration
[database]
host = localhost
port = 5432
username = finance_user
database_name = financial_news_db
connection_pool_size = 10
ssl_mode = prefer

[database:prod]
connection_pool_size = 20
ssl_mode = require

# Cache Configuration
[cache]
redis_host = localhost
redis_port = 6379
redis_db = 0
cache_ttl_seconds = 300
max_memory_mb = 512

[cache:prod]
max_memory_mb = 2048

# Message Queue Configuration
[message_queue]
broker_type = redis
hosts = localhost:6379
topic_prefix = financial_news
consumer_group = impact_analyzer
batch_size = 50
timeout_ms = 10000

[message_queue:prod]
batch_size = 100

# Business Logic Configuration
[business]
supported_currencies = EURUSD,GBPUSD,USDJPY,AUDUSD,USDCAD,USDCHF,NZDUSD,EURGBP,EURJPY,GBPJPY
supported_commodities = XAUUSD,XAGUSD,WTI,BRENT,NATGAS
impact_threshold_minor = 0.02
impact_threshold_moderate = 0.05
impact_threshold_major = 0.10
confidence_threshold = 0.7
analysis_window_hours = 24